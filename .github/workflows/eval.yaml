name: Skill checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skill:
        description: 'Evaluate one skill (leave empty for all)'
        required: false
        type: string
  schedule:
    - cron: '0 6 1 * *'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true
          require-lockfile: true
          node-version-file: .node-version
      - name: Validate skills
        run: pnpm run validate
      - name: Lint
        run: pnpm run lint
      - name: Test
        run: pnpm test

  eval:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true
          require-lockfile: true
          node-version-file: .node-version
      - name: Run evaluations
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_SKILL: ${{ inputs.skill }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "Evaluations skipped: ANTHROPIC_API_KEY is not configured."
            exit 0
          fi
          if [ -n "$EVAL_SKILL" ]; then
            pnpm run eval -- --skill "$EVAL_SKILL"
          else
            pnpm run eval
          fi
      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-results
          path: scripts/eval-results.json
          if-no-files-found: ignore
